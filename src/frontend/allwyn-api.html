<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="dark light">
    <title>BEN Plays a Deal</title>
    <link rel="stylesheet" href="allwyn.css">
    <link rel="stylesheet" href="allwyn-api.css">
    <script>
        // Set the theme before first paint, as allwyn.html does.
        try {
            const t = localStorage.getItem('allwyn.theme');
            document.documentElement.setAttribute('data-theme',
                (t === 'light' || t === 'system') ? t : 'dark');
        } catch (_) { /* private mode: fall back to the system theme */ }
    </script>
</head>

<body>
    <div id="loader" hidden></div>

    <header class="topbar">
        <h1><span class="mark" aria-hidden="true">B</span> BEN plays a deal</h1>
        <div class="topbar-actions">
            <a class="btn" href="/home">Home</a>
            <button type="button" class="btn" id="auction-toggle">Hide Auction</button>
            <button type="button" class="btn" id="help-toggle">Hide Help</button>
            <button type="button" class="btn" id="debug-toggle">Debug</button>
            <button type="button" class="btn" id="theme-toggle">Light</button>
        </div>
    </header>

    <p id="status" class="status" role="status" aria-live="polite" hidden></p>
    <p id="notice" class="notice" role="alert" aria-live="assertive" hidden></p>

    <main id="container">
        <!-- Controls and table share the left column; the sidebar has the right
             one to itself, so however long its log grows the table stays put. -->
        <div id="stage">
        <!-- Where allwyn.html has its bidding box: BEN bids every seat here. -->
        <section id="controls" class="panel" aria-label="Deal controls">
            <div class="controls-row">
                <label class="field field-file">
                    <span>Deal file</span>
                    <input type="file" id="deal-file" accept=".pbn,.lin,text/plain">
                </label>
                <label class="field field-board">
                    <span>Board</span>
                    <select id="board-select" disabled>
                        <option>Load a .pbn or .lin file</option>
                    </select>
                </label>
                <label class="field field-api">
                    <span>BEN API</span>
                    <input type="url" id="api-base" spellcheck="false" autocomplete="off">
                </label>
                <label class="field">
                    <span>You play</span>
                    <select id="human-seat">
                        <option value="">None - BEN plays all four</option>
                        <option value="N">North</option>
                        <option value="E">East</option>
                        <option value="S">South</option>
                        <option value="W">West</option>
                    </select>
                </label>
                <label class="field">
                    <span>Scoring</span>
                    <select id="tournament">
                        <option value="">Server default</option>
                        <option value="mp">Matchpoints</option>
                        <option value="imps">IMPs</option>
                    </select>
                </label>
                <label class="field">
                    <span>Pace</span>
                    <select id="pace">
                        <option value="0">Fast</option>
                        <option value="500" selected>Normal</option>
                        <option value="1500">Slow</option>
                    </select>
                </label>
            </div>
            <div class="controls-row controls-buttons">
                <button type="button" class="btn btn-primary" id="play-button" disabled>Play hand</button>
                <button type="button" class="btn" id="step-button" disabled>Step</button>
                <button type="button" class="btn" id="restart-button" disabled>Restart</button>
                <span class="progress" id="progress" aria-live="polite"></span>
            </div>
        </section>

        <!-- Your bidding box, when you play a seat. -->
        <div id="bidding" aria-label="Bidding box" hidden></div>

        <!-- The four seats around the table, laid out as the usual cross. -->
        <div id="play-area">
            <div id="north" class="hand" aria-label="North hand"></div>
            <div id="west" class="hand" aria-label="West hand"></div>

            <section id="table" aria-label="Table">
                <div id="table-container">
                    <div class="table-grid-item label-number"><span class="seat-label"></span></div>
                    <div class="table-grid-item label-north"><span class="seat-label">N</span></div>
                    <div class="table-grid-item label-west"><span class="seat-label">W</span></div>
                    <div class="table-grid-item trick-west"></div>
                    <div class="table-grid-item trick-north"></div>
                    <div class="table-grid-item trick-east"></div>
                    <div class="table-grid-item label-east"><span class="seat-label">E</span></div>
                    <div class="table-grid-item trick-south"></div>
                    <div class="table-grid-item label-south"><span class="seat-label">S</span></div>
                </div>

                <div class="tricks">Tricks</div>
                <div class="vuln" id="vuln"></div>

                <!-- Shown when the deal finishes. -->
                <div id="result" class="result" role="status" hidden>
                    <div id="result-you-label" class="result-label" hidden>Your table</div>
                    <div id="result-contract" class="result-contract"></div>
                    <div id="result-outcome" class="result-outcome"></div>
                    <div id="result-score" class="result-score" hidden></div>
                    <!-- The same board elsewhere: as recorded in the file, and as BEN
                         played it. One compact row each, against the result above. -->
                    <table id="result-others" class="result-others" hidden>
                        <tbody>
                            <tr id="result-rec-row" hidden>
                                <th>Recorded</th><td class="contract"></td><td class="made"></td>
                                <td class="score"></td><td class="diff"></td>
                            </tr>
                            <tr id="result-ben-row" hidden>
                                <th>BEN</th><td class="contract"></td><td class="made"></td>
                                <td class="score"></td><td class="diff"></td>
                            </tr>
                        </tbody>
                    </table>
                    <!-- Where the comparison with BEN is up to, when you played a seat. -->
                    <div id="result-compare" class="result-compare" aria-live="polite" hidden></div>
                    <div class="result-buttons">
                        <button type="button" class="btn" id="result-show-compare" hidden>Compare with BEN</button>
                        <button type="button" class="btn btn-primary" id="result-continue">Close</button>
                    </div>
                </div>

                <section id="auction-main" class="panel" aria-label="Auction">
                    <div id="auction-container"></div>
                </section>
            </section>

            <div id="east" class="hand" aria-label="East hand"></div>
            <div id="south" class="hand" aria-label="South hand"></div>
        </div>

        <!-- For each board played from this file, a line for your table, the
             recorded one and BEN's: contract, result, We / They. Kept in the
             browser per file. -->
        <section id="scorecard" class="panel" aria-label="Scorecard" hidden>
            <div class="scorecard-head">
                <h2>Scorecard</h2>
                <span class="scorecard-file" id="scorecard-file"></span>
                <button type="button" class="btn" id="scorecard-csv">Download CSV</button>
                <button type="button" class="btn" id="scorecard-clear">Clear</button>
            </div>
            <div class="scorecard-scroll">
                <table id="scorecard-table">
                    <thead>
                        <tr>
                            <th class="sc-board">Board</th>
                            <th>Table</th>
                            <th>Contract</th>
                            <th>Result</th>
                            <th class="sc-num">We</th>
                            <th class="sc-num">They</th>
                        </tr>
                    </thead>
                    <!-- One <tbody> per board, added at the bottom as boards are played. -->
                    <tfoot id="scorecard-foot"></tfoot>
                </table>
            </div>
        </section>

        <!-- ?debug=true: every request to gameapi.py and what came back. -->
        <section id="debug" class="panel" aria-label="API debug log" hidden>
            <div class="debug-head">
                <h2>Debug - API requests</h2>
                <span class="debug-count" id="debug-count"></span>
                <button type="button" class="btn" id="debug-copy">Copy JSON</button>
                <button type="button" class="btn" id="debug-clear">Clear</button>
            </div>
            <ol id="debug-list"></ol>
        </section>
        </div>

        <aside id="sidebar">
            <!-- Filled in after a deal you played: BEN in your seat, and BEN at all four. -->
            <section id="compare" class="panel" aria-label="Your deal compared" hidden>
                <h2>Comparison</h2>
                <!-- Against the result recorded in the file, when it has one. -->
                <div id="compare-recorded" hidden>
                    <h3 id="compare-recorded-title">Against the recorded table</h3>
                    <div id="compare-recorded-body"></div>
                </div>
                <!-- Against BEN: automatic without a recorded result, on request with one. -->
                <div id="compare-ben" hidden>
                    <h3>Against BEN</h3>
                    <button type="button" class="btn" id="compare-ben-start" hidden>Compare with BEN</button>
                    <p id="compare-status" class="compare-status" aria-live="polite"></p>
                    <div id="compare-result"></div>
                    <div id="compare-decisions"></div>
                </div>
            </section>
            <div id="explain" class="explain" aria-label="Bidding explanations"></div>
            <section id="play-log" class="panel" aria-label="What BEN did" hidden>
                <h2>BEN's decisions</h2>
                <ol id="play-log-list"></ol>
            </section>
        </aside>
    </main>

    <dialog id="choice-dialog" aria-labelledby="choice-title">
        <h2 id="choice-title">Your choices</h2>
        <div class="body" id="choice-body"></div>
        <form method="dialog" class="buttons">
            <button class="btn btn-primary" value="close" autofocus>Close</button>
        </form>
    </dialog>

    <dialog id="hint-dialog" aria-labelledby="hint-title">
        <h2 id="hint-title">Hint</h2>
        <div class="body" id="hint-body"></div>
        <form method="dialog" class="buttons">
            <button class="btn btn-primary" value="close" autofocus>Close</button>
        </form>
    </dialog>

    <script type="module" src="allwyn.apimain.js"></script>
</body>

</html>
