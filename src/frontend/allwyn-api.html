<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="dark light">
    <title>BEN Plays a Deal</title>
    <link rel="stylesheet" href="allwyn.css">
    <link rel="stylesheet" href="allwyn-api.css">
    <script>
        // Set the theme before first paint, as allwyn.html does.
        try {
            const t = localStorage.getItem('allwyn.theme');
            document.documentElement.setAttribute('data-theme',
                (t === 'light' || t === 'system') ? t : 'dark');
        } catch (_) { /* private mode: fall back to the system theme */ }
    </script>
</head>

<body>
    <div id="loader" hidden></div>

    <header class="topbar">
        <h1><span class="mark" aria-hidden="true">B</span> BEN plays a deal</h1>
        <div class="topbar-actions">
            <a class="btn" href="/home">Home</a>
            <button type="button" class="btn" id="auction-toggle">Hide Auction</button>
            <button type="button" class="btn" id="help-toggle">Hide Help</button>
            <button type="button" class="btn" id="theme-toggle">Light</button>
        </div>
    </header>

    <p id="status" class="status" role="status" aria-live="polite" hidden></p>
    <p id="notice" class="notice" role="alert" aria-live="assertive" hidden></p>

    <main id="container">
        <!-- Where allwyn.html has its bidding box: BEN bids every seat here. -->
        <section id="controls" class="panel" aria-label="Deal controls">
            <div class="controls-row">
                <label class="field field-file">
                    <span>Deal file</span>
                    <input type="file" id="deal-file" accept=".pbn,.lin,text/plain">
                </label>
                <label class="field field-board">
                    <span>Board</span>
                    <select id="board-select" disabled>
                        <option>Load a .pbn or .lin file</option>
                    </select>
                </label>
                <label class="field field-api">
                    <span>BEN API</span>
                    <input type="url" id="api-base" spellcheck="false" autocomplete="off">
                </label>
                <label class="field">
                    <span>Scoring</span>
                    <select id="tournament">
                        <option value="">Server default</option>
                        <option value="mp">Matchpoints</option>
                        <option value="imps">IMPs</option>
                    </select>
                </label>
                <label class="field">
                    <span>Pace</span>
                    <select id="pace">
                        <option value="0">Fast</option>
                        <option value="500" selected>Normal</option>
                        <option value="1500">Slow</option>
                    </select>
                </label>
            </div>
            <div class="controls-row controls-buttons">
                <button type="button" class="btn btn-primary" id="play-button" disabled>Play hand</button>
                <button type="button" class="btn" id="step-button" disabled>Step</button>
                <button type="button" class="btn" id="restart-button" disabled>Restart</button>
                <span class="progress" id="progress" aria-live="polite"></span>
            </div>
        </section>

        <!-- The four seats around the table, laid out as the usual cross. -->
        <div id="play-area">
            <div id="north" class="hand" aria-label="North hand"></div>
            <div id="west" class="hand" aria-label="West hand"></div>

            <section id="table" aria-label="Table">
                <div id="table-container">
                    <div class="table-grid-item label-number"><span class="seat-label"></span></div>
                    <div class="table-grid-item label-north"><span class="seat-label">N</span></div>
                    <div class="table-grid-item label-west"><span class="seat-label">W</span></div>
                    <div class="table-grid-item trick-west"></div>
                    <div class="table-grid-item trick-north"></div>
                    <div class="table-grid-item trick-east"></div>
                    <div class="table-grid-item label-east"><span class="seat-label">E</span></div>
                    <div class="table-grid-item trick-south"></div>
                    <div class="table-grid-item label-south"><span class="seat-label">S</span></div>
                </div>

                <div class="tricks">Tricks</div>
                <div class="vuln" id="vuln"></div>

                <!-- Shown when the deal finishes. -->
                <div id="result" class="result" role="status" hidden>
                    <div id="result-contract" class="result-contract"></div>
                    <div id="result-outcome" class="result-outcome"></div>
                    <div id="result-score" class="result-score" hidden></div>
                    <button type="button" class="btn btn-primary" id="result-continue">Close</button>
                </div>

                <section id="auction-main" class="panel" aria-label="Auction">
                    <div id="auction-container"></div>
                </section>
            </section>

            <div id="east" class="hand" aria-label="East hand"></div>
            <div id="south" class="hand" aria-label="South hand"></div>
        </div>

        <aside id="sidebar">
            <div id="explain" class="explain" aria-label="Bidding explanations"></div>
            <section id="play-log" class="panel" aria-label="What BEN did" hidden>
                <h2>BEN's decisions</h2>
                <ol id="play-log-list"></ol>
            </section>
        </aside>
    </main>

    <script type="module" src="allwyn.apimain.js"></script>
</body>

</html>
