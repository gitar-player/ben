<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="dark light">
    <title>Bridge with BEN</title>
    <link rel="stylesheet" href="allwyn.css">
    <script>
        // Set the theme before first paint so a forced light theme does not
        // flash dark. Kept inline and tiny for that reason; the rest of the
        // theme logic is in allwyn.theme.js.
        try {
            const t = localStorage.getItem('allwyn.theme');
            document.documentElement.setAttribute('data-theme',
                (t === 'light' || t === 'system') ? t : 'dark');
        } catch (_) { /* private mode: fall back to the system theme */ }
    </script>
</head>

<body>
    <div id="loader" hidden></div>

    <header class="topbar">
        <h1><span class="mark" aria-hidden="true">B</span> Bridge with BEN</h1>
        <div class="topbar-actions">
            <a class="btn" href="/home">Home</a>
            <button type="button" class="btn" id="theme-toggle">Dark</button>
        </div>
    </header>

    <p id="status" class="status" role="status" aria-live="polite" hidden></p>
    <p id="notice" class="notice" role="alert" aria-live="assertive" hidden></p>

    <main id="container">
        <!-- The four seats around the table, laid out as the usual cross. -->
        <div id="play-area">
            <div id="north" class="hand" aria-label="North hand"></div>
            <div id="west" class="hand" aria-label="West hand"></div>

            <section id="table" aria-label="Table">
                <div id="table-container">
                    <div class="table-grid-item label-number"><span class="seat-label"></span></div>
                    <div class="table-grid-item label-north"><span class="seat-label">N</span></div>
                    <div class="table-grid-item label-west"><span class="seat-label">W</span></div>
                    <div class="table-grid-item trick-west"></div>
                    <div class="table-grid-item trick-north"></div>
                    <div class="table-grid-item trick-east"></div>
                    <div class="table-grid-item label-east"><span class="seat-label">E</span></div>
                    <div class="table-grid-item trick-south"></div>
                    <div class="table-grid-item label-south"><span class="seat-label">S</span></div>
                </div>
            </section>

            <div id="east" class="hand" aria-label="East hand"></div>
            <div id="south" class="hand" aria-label="South hand"></div>
        </div>

        <div id="bidding" aria-label="Bidding box"></div>

        <aside id="sidebar">
            <section id="auction-main" class="panel" aria-label="Auction">
                <div id="auction-container"></div>
                <div class="tricks">Tricks</div>
                <div class="actions">
                    <div id="last-trick" hidden>Show last trick</div>
                    <div id="claim" hidden>Claim
                        <div id="claim-tricks"></div>
                    </div>
                    <div id="conceed" hidden>Concede</div>
                </div>
            </section>

            <div id="explain" class="explain" aria-label="Bidding explanations"></div>
        </aside>
    </main>

    <!-- Native dialogs: no jQuery UI, and nothing fetched from a CDN. -->
    <dialog id="hint-dialog" aria-labelledby="hint-title">
        <h2 id="hint-title">Hint</h2>
        <div class="body" id="hint-body"></div>
        <form method="dialog" class="buttons">
            <button class="btn btn-primary" value="close" autofocus>Close</button>
        </form>
    </dialog>

    <dialog id="feedback-dialog" aria-labelledby="feedback-title">
        <h2 id="feedback-title">How did that deal go?</h2>
        <div class="body">
            <label for="commentInput">Comments on this deal</label>
            <textarea id="commentInput" placeholder="Anything worth noting..."></textarea>
        </div>
        <form method="dialog" class="buttons">
            <button class="btn" value="nosave">Don't save</button>
            <button class="btn" value="bad">Bad</button>
            <button class="btn" value="ok">OK</button>
            <button class="btn btn-primary" value="good" autofocus>Good</button>
        </form>
    </dialog>

    <script type="module" src="allwyn.main.js"></script>
</body>

</html>
